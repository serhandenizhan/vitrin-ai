services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitrin_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-vitrin_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitrin_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PR #13 kapanışı: yükleme hız sınırlayıcısı (backend/app/services/rate_limit.py)
  # process içi bellekten buraya taşındı — dağıtık/çoklu worker'da doğru
  # çalışması için. Kalıcı bir volume bilinçli olarak YOK: rate-limit anahtarları
  # kısa TTL'li (birkaç saniye-dakika) ve zaten geçici; container yeniden
  # başlarsa sayaçların sıfırlanması zararsız. Celery/RQ (ROADMAP'te planlı,
  # henüz kurulmadı) bu Redis'i broker olarak kullanmaya başladığında kalıcılık
  # yeniden değerlendirilmeli.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
