services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitrin_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-vitrin_ai}
    # Yalnız bu bilgisayardan erişilir (127.0.0.1). Adres verilmezse Docker
    # portu BÜTÜN ağ arayüzlerinde açıyor: aynı ağdaki (kafe, ortak ofis)
    # biri depodaki varsayılan parolayla girip execute.sh'ın production'dan
    # kopyaladığı kullanıcı verisini okuyabiliyordu (/cso incelemesi, 27.09.2026).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitrin_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PR #13 kapanışı: yükleme hız sınırlayıcısı (backend/app/services/rate_limit.py)
  # process içi bellekten buraya taşındı — dağıtık/çoklu worker'da doğru
  # çalışması için. Kalıcı bir volume bilinçli olarak YOK: rate-limit anahtarları
  # kısa TTL'li (birkaç saniye-dakika) ve zaten geçici; container yeniden
  # başlarsa sayaçların sıfırlanması zararsız.
  #
  # Faz 7'den beri kesim kuyruğu da burada ve özgün fotoğrafı en fazla 15 dk
  # BELLEKTE tutuyor; KVKK metni "diske yazılmaz" diyor. Redis'in varsayılanı
  # belleği `dump.rdb`'ye yazar (RDB), bu yüzden RDB ve AOF açıkça kapalı.
  # API bunu her kuyruğa koymadan önce doğrular; açıksa fotoğrafı almaz.
  # Canlıdaki Redis de AYNI ayarla çalışmalı (backend/README.md "Kesim kuyruğu").
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # İmaj /data'yı anonim volume olarak tanımlıyor ve compose onu kapsayıcı
    # yeniden oluşturulsa bile KORUYOR: eski bir dump.rdb orada kalıp açılışta
    # belleğe geri yükleniyordu (ölçüldü). /data bellekte: elle bir BGSAVE
    # bile diske ulaşmaz.
    tmpfs:
      - /data
    # Yalnız bu bilgisayardan (bkz. postgres). Redis'in parolası yok ve
    # sıradaki özgün fotoğrafları tutuyor.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
