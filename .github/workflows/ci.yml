# Faz 7 (Serhan, 26.09.2026): her PR'da ve main'e her push'ta backend/frontend
# testleri ile bağımlılık güvenlik taraması otomatik koşar. Önceden testler
# yalnız elle koşuluyordu; yerel `.env`'ye gizlice bağlı bir test (bkz.
# backend/tests/test_admin_api.py) ancak `.env`'siz bu ortamda ortaya çıktı.
#
# Aksiyonlar sürüm etiketiyle değil COMMIT SHA'sıyla sabitlenir: bir etiket
# sonradan başka bir commit'e taşınabilir (tedarik zinciri riski).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Kod değişmese de yeni yayımlanan açıklar haftada bir görünsün.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend testleri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Testler gerçek Postgres ve Redis ister ve bağlandıkları veritabanını
    # sıfırlar; buradaki servisler iş bitince atılır.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitrin_ai
          POSTGRES_PASSWORD: change_me_locally
          POSTGRES_DB: vitrin_ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitrin_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://vitrin_ai:change_me_locally@localhost:5432/vitrin_ai_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # backend/Dockerfile ile aynı sürüm.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tanımsız isim / kullanılmayan içe aktarma gibi testlerin kaçırabileceği
      # hatalar (27.09.2026). İş adı DEĞİŞMEDİ: "protect main" kural seti bu
      # işi adıyla bekliyor (kök CLAUDE.md → Git iş akışı).
      - run: ruff check app tests scripts alembic
      - run: pytest -q

  frontend-tests:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Playwright E2E (Kaan, 30.09.2026). ZORUNLU KONTROL DEĞİL: "protect main" kural
  # setine eklenmedi (karar Serhan'ın; iş adı değişirse kural da güncellenir).
  # Hermetik: gerçek Supabase/backend YOK. Sahte Supabase adresi derlemeye gömülür,
  # `BACKEND_URL` ulaşılamaz bir adrestir; testler oturumu ve `/api/*` yanıtlarını
  # tarayıcıda taklit eder (`frontend/e2e/oturum.ts`). Yerelde backend kapalıyken de
  # aynı koşulla 84 test geçti (16 atlama masaüstü/telefon ayrımı).
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://e2e-dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-dummy-key
      BACKEND_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e

  # Testlerden AYRI bir iş: yeni yayımlanan bir açık PR'ı kırdığında,
  # kırmızının sebebi kod değil bağımlılık olduğu tek bakışta görülsün.
  dependency-audit:
    name: Bağımlılık güvenlik taraması
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-dev.txt
      # Zorunlu kapı yalnız ÜRETİM bağımlılıklarını tarar: geliştirme araçlarındaki
      # (shadcn CLI, eslint eklentisi) düzeltilmiş sürümü olmayan bir açık, ilgisiz
      # bütün PR'ları durdurmasın (03.10.2026, braces GHSA-vfj7-8cjw-p6xm).
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --omit=dev
      # Geliştirme araçları dahil tarama engellemez, yalnız görünür kalır.
      - name: npm audit (frontend, geliştirme araçları dahil, bilgi amaçlı)
        working-directory: frontend
        continue-on-error: true
        run: npm audit
